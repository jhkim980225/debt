name: debt_free
description: "빚 상환 여정을 함께하는 동반자 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.4.9

  # 로컬 저장
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # 차트
  fl_chart: ^0.66.0

  # 날짜/숫자 포맷
  intl: ^0.19.0

  # 네비게이션
  go_router: ^13.0.0

  # 보안 저장
  flutter_secure_storage: ^9.0.0

  # 생체인증
  local_auth: ^2.1.7

  # UUID
  uuid: ^4.2.1

  # Supabase
  supabase_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
